name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: ningún job de CI escribe en el repositorio. Sin esto el token
# heredaba los permisos por defecto de la organización.
permissions:
  contents: read

# Un push nuevo a la misma PR cancela la verificación anterior; en main no se
# cancela nada (cada commit fusionado se verifica entero).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify
        run: npm run verify

  migraciones:
    name: Reproducir migraciones
    runs-on: ubuntu-latest
    # Corre en PR además de en push: es la comprobación que faltaba cuando la
    # primera ejecución real del workflow de migraciones murió en la 034 contra
    # producción. No usa secrets ni toca ninguna base real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Reproducir migraciones desde cero
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: scripts/replay-migrations.sh

  # E2E sin secretos: la aplicación en modo de capturas (datos de demostración
  # en memoria, sin Supabase). Corre en cada pull request, ANTES de fusionar;
  # el job de abajo, contra Supabase real, solo tras fusionar.
  e2e-local:
    name: E2E sin secretos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (modo capturas)
        run: npm run e2e:local

      # Lo que el modo desarrollo no puede comprobar: la CSP con nonce real y
      # la hidratación sobre el build de producción.
      - name: Build de producción
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Run E2E (build de producción)
        run: npm run e2e:prod

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-local
          path: |
            playwright-report-local/
            test-results-local/
            playwright-report-prod/
            test-results-prod/
          retention-days: 7

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    # Solo en push/dispatch: este job recibe secrets (Supabase, credenciales E2E)
    # y no debe ejecutar código de un PR no confiable del propio repo.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npm run e2e:install

      - name: Run E2E
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supabase-readiness:
    name: Supabase readiness
    runs-on: ubuntu-latest
    # Solo en push/dispatch: usa SUPABASE_SERVICE_ROLE_KEY. No exponerlo a código
    # de PRs (un PR del repo podría modificar el script y exfiltrarlo).
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Audit remote
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          READINESS_ALLOWED_EMAILS: ${{ secrets.READINESS_ALLOWED_EMAILS }}
        run: node scripts/supabase-readiness-audit.mjs
