# Aplica solas las migraciones pendientes de supabase/migrations/ contra la base
# de datos de PRODUCCIÓN, en cuanto llegan a main. Toda la lógica vive aquí.
#
# ── El único secret que hay que crear ────────────────────────────────────────
#   SUPABASE_DB_URL
#     Supabase → Project Settings → Database → Connection string → *Session
#     pooler* (puerto 5432), con la contraseña dentro.
#     · NO vale la conexión directa db.<ref>.supabase.co: solo resuelve por IPv6
#       y los runners de GitHub solo tienen IPv4.
#     · Si la contraseña lleva @ : / ? # o %, escápalos (%40 %3A %2F %3F %23 %25).
#   Sin el secret el workflow falla en el primer paso sin tocar nada.
#
# ── Por qué un registro propio y no el del CLI de Supabase ───────────────────
# `supabase db push` no sirve en este proyecto. Compara las versiones locales
# con las de supabase_migrations.schema_migrations posicionalmente, y esa tabla
# ya está escrita por otra vía: las migraciones 023, 024 y 025 se aplicaron con
# el MCP de Supabase (.planning/phases/08-backlog-detailed/PLAN.md), que graba
# versiones con formato de timestamp. Esas versiones ordenan por encima de los
# prefijos 001-035 de este repo, así que el CLI las clasifica como «remotas sin
# fichero local» y aborta con ErrMissingLocal. «Arreglarlo» desde CI obligaría a
# borrar filas de la tabla que el dashboard y el propio MCP usan como registro.
#
# Este workflow usa su propio registro en el esquema `deploy` y NO toca
# supabase_migrations.schema_migrations: lo lee para detectar conflictos, nunca
# lo escribe. Los nombres de fichero siguen siendo válidos para el CLI, así que
# migrar a `db push` en el futuro sigue siendo posible.
name: Migraciones Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # Incluirse a sí mismo hace que la primera ejecución arranque sola al
      # fusionar este fichero, sin tener que ir a Actions a lanzarla.
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      solo_plan:
        description: "Solo mostrar qué se aplicaría, sin tocar la base"
        type: boolean
        default: false

# Dos pushes seguidos no migran a la vez, y el segundo espera en vez de
# cancelar al primero: cancelar a mitad de un DDL es justo lo que no queremos.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar migraciones pendientes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGURL: ${{ secrets.SUPABASE_DB_URL }}
      SOLO_PLAN: ${{ inputs.solo_plan && 'true' || 'false' }}
      # Las 32 migraciones aplicadas a mano en el editor SQL antes de que
      # existiera este workflow. Lista LITERAL y congelada a propósito: con un
      # «<= 033» cualquier fichero futuro con número bajo se daría por aplicado
      # sin ejecutarse, en silencio y para siempre.
      BASELINE: "001 003 004 005 006 007 008 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028 029 030 031 032 033"
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el secret existe
        run: |
          if [ -z "${PGURL}" ]; then
            echo "::error title=Falta SUPABASE_DB_URL::Créalo en Settings → Secrets and variables → Actions con la cadena del Session pooler (puerto 5432, percent-encoded)."
            exit 1
          fi

      - name: Comprobar que la cadena de conexión es utilizable
        # Diagnostica ANTES de tocar nada. Sin este paso, una cadena mal formada
        # produce el error más confuso posible de psql —«connection to server on
        # socket /var/run/postgresql/... failed»—, que parece un problema del
        # runner cuando en realidad psql ha interpretado el valor como un simple
        # nombre de base de datos y ha caído al socket local por defecto.
        #
        # Nada de lo que se imprime aquí revela credenciales: psql nunca vuelca
        # la contraseña, y el host del pooler no es un secreto.
        run: |
          set -uo pipefail
          case "$PGURL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=SUPABASE_DB_URL no es una URI::El valor no empieza por postgresql://, así que psql lo toma como nombre de base de datos e intenta conectarse al socket local. Copia la cadena entera desde Supabase → Project Settings → Database → Connection string → Session pooler, incluidos el esquema, el usuario, la contraseña, el host y el puerto."
              exit 1 ;;
          esac

          if printf '%s' "$PGURL" | grep -q '@db\.[a-z0-9]\{16,\}\.supabase\.co'; then
            echo "::error title=Esa conexión no la alcanzan los runners::Estás usando la conexión directa db.<ref>.supabase.co, que solo resuelve por IPv6; los runners de GitHub solo tienen IPv4. Usa la cadena del Session pooler (host …pooler.supabase.com, puerto 5432)."
            exit 1
          fi

          if ! psql "$PGURL" -X -tAc 'SELECT 1' >/dev/null 2>/tmp/psql_err; then
            echo "::error title=No se pudo conectar a la base de datos::$(head -2 /tmp/psql_err | tr '\n' ' ')"
            echo "Repasa, por este orden:"
            echo "  · Que sea la cadena del *Session pooler* (puerto 5432), no la directa ni la de transaction pooler (6543)."
            echo "  · Que la contraseña esté completa y percent-encoded: @ → %40, : → %3A, / → %2F, ? → %3F, # → %23, % → %25."
            echo "  · Que al pegar el secret no se haya colado un espacio, un salto de línea o unas comillas."
            exit 1
          fi
          echo "Conexión correcta."

      # ── Todo lo que sigue hasta «Aplicar» es de SOLO LECTURA ────────────────

      - name: Inventario de migraciones del repositorio
        id: inventario
        run: |
          set -euo pipefail
          declare -A vistas
          : > /tmp/inventario.txt
          for f in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            n=$(basename "$f")
            if ! [[ "$n" =~ ^([0-9]+)_(.+)\.sql$ ]]; then
              echo "::error::Fichero de migración con nombre inválido: $n (debe ser <numero>_<nombre>.sql)"
              exit 1
            fi
            v="${BASH_REMATCH[1]}"
            if [ -n "${vistas[$v]:-}" ]; then
              echo "::error::Versión duplicada $v: '${vistas[$v]}' y '$n'"
              exit 1
            fi
            vistas[$v]="$n"
            printf '%s\t%s\n' "$v" "$f" >> /tmp/inventario.txt
          done
          echo "Migraciones en el repositorio: $(wc -l < /tmp/inventario.txt)"

      - name: Calcular qué está pendiente
        id: plan
        run: |
          set -euo pipefail
          : > /tmp/registradas.txt
          existe=$(psql "$PGURL" -X -tAq -c \
            "SELECT to_regclass('deploy.applied_migrations') IS NOT NULL")

          if [ "$existe" = "t" ]; then
            psql "$PGURL" -X -tAq -c \
              'SELECT version FROM deploy.applied_migrations' | sort > /tmp/registradas.txt
          elif [ "$SOLO_PLAN" = "true" ]; then
            # El modo «solo plan» no escribe NADA, ni siquiera una tabla vacía:
            # si el registro no existe, se planifica como si estuviera vacío.
            echo "El registro aún no existe. En modo solo plan no se crea."
          else
            # El registro vive en un esquema propio y no en `public`, donde
            # PostgREST lo expondría y el Security Advisor lo señalaría.
            psql "$PGURL" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS deploy;
          CREATE TABLE IF NOT EXISTS deploy.applied_migrations (
            version     text PRIMARY KEY,
            name        text        NOT NULL,
            checksum    text        NOT NULL,
            applied_at  timestamptz NOT NULL DEFAULT now(),
            applied_by  text        NOT NULL DEFAULT 'workflow'
          );
          COMMENT ON TABLE deploy.applied_migrations IS
            'Registro de migraciones aplicadas por el workflow de GitHub Actions. Deliberadamente separado de supabase_migrations.schema_migrations, que escriben el CLI y el MCP de Supabase.';
          SQL
          fi

          : > /tmp/pendientes.txt
          : > /tmp/baseline_faltante.txt
          while IFS=$'\t' read -r v f; do
            grep -qxF "$v" /tmp/registradas.txt && continue
            if [[ " $BASELINE " == *" $v "* ]]; then
              printf '%s\t%s\n' "$v" "$f" >> /tmp/baseline_faltante.txt
            else
              printf '%s\t%s\n' "$v" "$f" >> /tmp/pendientes.txt
            fi
          done < /tmp/inventario.txt

          # Un fichero con número por debajo del baseline que NO esté en la
          # lista literal es un error humano, no algo que dar por aplicado.
          while IFS=$'\t' read -r v f; do
            if [[ "$v" < "034" ]] && [[ " $BASELINE " != *" $v "* ]]; then
              echo "::error::La migración $v ($f) tiene un número por debajo del baseline pero no está en la lista BASELINE. Revísalo a mano: no se va a aplicar ni a dar por aplicada."
              exit 1
            fi
          done < /tmp/inventario.txt

          nb=$(wc -l < /tmp/baseline_faltante.txt)
          np=$(wc -l < /tmp/pendientes.txt)
          echo "baseline_faltante=$nb" >> "$GITHUB_OUTPUT"
          echo "pendientes=$np" >> "$GITHUB_OUTPUT"
          echo "Por registrar como ya aplicadas (baseline): $nb"
          echo "Pendientes de ejecutar: $np"
          if [ "$np" -gt 0 ]; then cut -f2 /tmp/pendientes.txt | sed 's/^/  · /'; fi

      - name: Revisar que lo pendiente no sea destructivo
        if: steps.plan.outputs.pendientes != '0'
        run: |
          set -euo pipefail
          problemas=0
          while IFS=$'\t' read -r v f; do
            # Se quitan los comentarios de línea (para no saltar por un DROP
            # citado dentro de una explicación) y se normaliza a una sola línea
            # en minúsculas, porque estas comprobaciones son por SENTENCIA y no
            # por línea: un DELETE y su WHERE suelen estar en líneas distintas.
            cuerpo=$(sed 's/--.*$//' "$f" | tr '\n' ' ' | tr '[:upper:]' '[:lower:]')

            if grep -qE '(drop[[:space:]]+(table|column|schema|database)|truncate[[:space:]])' <<< "$cuerpo"; then
              echo "::error::$f contiene una sentencia destructiva (DROP TABLE/COLUMN/SCHEMA o TRUNCATE). Aplícala a mano y con copia previa: este workflow no ejecuta borrados desatendidos."
              problemas=1
            fi

            # ALTER TYPE ... ADD VALUE no puede ejecutarse en la misma
            # transacción que consume el valor nuevo, y aquí cada fichero va en
            # una sola transacción.
            if grep -qE 'alter[[:space:]]+type[[:space:]]+.*add[[:space:]]+value' <<< "$cuerpo"; then
              echo "::error::$f usa ALTER TYPE ... ADD VALUE, que no admite ejecutarse dentro de una transacción junto con su uso. Sepáralo en su propio fichero o aplícalo a mano."
              problemas=1
            fi

            # DELETE o UPDATE sin WHERE arrasan la tabla entera. Se parte por
            # ';' y se mira cada sentencia por separado; ante la duda se marca,
            # que el coste de una revisión a mano es menor que el de un borrado.
            while IFS= read -r st; do
              [ -n "$st" ] || continue
              if grep -qE '^[[:space:]]*(delete[[:space:]]+from|update)[[:space:]]' <<< "$st" \
                 && ! grep -qE '[[:space:]]where[[:space:]]' <<< "$st"; then
                echo "::error::$f tiene un DELETE o UPDATE sin WHERE: «$(cut -c1-80 <<< "$st")…». Aplícalo a mano."
                problemas=1
              fi
            done < <(tr ';' '\n' <<< "$cuerpo")
          done < /tmp/pendientes.txt
          [ "$problemas" -eq 0 ] || exit 1
          echo "Sin sentencias destructivas ni incompatibles con transacción."

      - name: Comprobar que no las aplicó ya el MCP o el CLI
        if: steps.plan.outputs.pendientes != '0'
        run: |
          set -euo pipefail
          # supabase_migrations.schema_migrations puede no existir; eso es normal.
          otras=$(psql "$PGURL" -X -tAq -c \
            "SELECT string_agg(version, ' ') FROM supabase_migrations.schema_migrations" 2>/dev/null || true)
          [ -n "$otras" ] || { echo "El registro del CLI está vacío o no existe: sin conflictos."; exit 0; }
          echo "Versiones en el registro del CLI/MCP: $otras"
          conflicto=0
          while IFS=$'\t' read -r v f; do
            if [[ " $otras " == *" $v "* ]]; then
              echo "::error::La migración $v ya figura como aplicada en supabase_migrations.schema_migrations (la aplicó el CLI o el MCP). Regístrala a mano en deploy.applied_migrations en vez de dejar que se ejecute dos veces."
              conflicto=1
            fi
          done < /tmp/pendientes.txt
          [ "$conflicto" -eq 0 ] || exit 1

      - name: Detectar migraciones ya aplicadas que se hayan editado
        run: |
          set -euo pipefail
          # El registro puede no existir todavía (primera ejecución, o modo solo
          # plan, que no lo crea): en ese caso no hay nada contra lo que comparar.
          [ -s /tmp/registradas.txt ] || { echo "Sin migraciones registradas: nada que comparar."; exit 0; }
          while IFS=$'\t' read -r v f; do
            reg=$(psql "$PGURL" -X -tAq -c \
              "SELECT checksum FROM deploy.applied_migrations WHERE version = '$v'" 2>/dev/null || true)
            [ -n "$reg" ] || continue
            act=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$reg" != "$act" ] && [ "$reg" != "baseline" ]; then
              echo "::warning::$f cambió después de aplicarse. No se va a reejecutar; si el cambio importa, haz una migración nueva."
            fi
          done < /tmp/inventario.txt

      - name: Parar aquí si solo se pedía el plan
        if: env.SOLO_PLAN == 'true'
        run: |
          echo "Solo plan: no se ha escrito nada en la base más allá del registro vacío."
          exit 0

      # ── A partir de aquí sí se escribe ─────────────────────────────────────

      - name: Registrar el baseline
        if: env.SOLO_PLAN != 'true' && steps.plan.outputs.baseline_faltante != '0'
        run: |
          set -euo pipefail
          # Marca como aplicadas, SIN ejecutarlas, las que se pasaron a mano.
          # checksum='baseline' las distingue de las que aplicó el workflow, y
          # evita avisar de deriva sobre ficheros que nadie ejecutó aquí.
          # Por entrada estándar y no con -c: psql solo interpola las variables
          # :'...' cuando lee de fichero o de stdin, nunca en -c.
          while IFS=$'\t' read -r v f; do
            n=$(basename "$f")
            psql "$PGURL" -X -q -v ON_ERROR_STOP=1 -v ver="$v" -v nom="$n" <<'SQL'
          INSERT INTO deploy.applied_migrations (version, name, checksum, applied_by)
          VALUES (:'ver', :'nom', 'baseline', 'baseline: aplicada a mano en el editor SQL')
          ON CONFLICT (version) DO NOTHING;
          SQL
            echo "  baseline · $n"
          done < /tmp/baseline_faltante.txt

      - name: Aplicar
        id: aplicar
        if: env.SOLO_PLAN != 'true' && steps.plan.outputs.pendientes != '0'
        run: |
          set -euo pipefail
          aplicadas=0
          while IFS=$'\t' read -r v f; do
            n=$(basename "$f")
            s=$(sha256sum "$f" | cut -d' ' -f1)
            echo "── Aplicando $n"
            # Una transacción por fichero. El INSERT va DENTRO y es además el
            # cerrojo: la clave primaria hace que una segunda ejecución
            # simultánea choque y aborte sin llegar a ejecutar el SQL.
            psql "$PGURL" -X -q -v ON_ERROR_STOP=1 --single-transaction \
              -v ver="$v" -v nom="$n" -v sum="$s" <<SQL
          INSERT INTO deploy.applied_migrations (version, name, checksum)
          VALUES (:'ver', :'nom', :'sum');
          \\i '$f'
          SQL
            aplicadas=$((aplicadas + 1))
            echo "   ✓ $n"
          done < /tmp/pendientes.txt
          echo "aplicadas=$aplicadas" >> "$GITHUB_OUTPUT"
          echo "Aplicadas $aplicadas migraciones."

      - name: Refrescar la caché de esquema de PostgREST
        # always(): si algo falló a mitad de la tanda, las que sí se aplicaron
        # necesitan igualmente que PostgREST recargue, o la API devolverá
        # PGRST204/205 sobre columnas que ya existen.
        if: always() && env.SOLO_PLAN != 'true' && steps.aplicar.outputs.aplicadas != '' && steps.aplicar.outputs.aplicadas != '0'
        run: psql "$PGURL" -X -q -c "NOTIFY pgrst, 'reload schema'" || true

      - name: Estado final
        if: always() && env.SOLO_PLAN != 'true'
        run: |
          psql "$PGURL" -X -c \
            "SELECT version, name, applied_at, applied_by FROM deploy.applied_migrations ORDER BY version" || true
