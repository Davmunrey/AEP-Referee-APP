# XcodeGen — genera AEPTarima.xcodeproj a partir de este manifiesto.
# En el Mac:  brew install xcodegen  &&  cd apps/ios  &&  xcodegen generate
# Luego abre AEPTarima.xcodeproj.
name: AEPTarima
options:
  bundleIdPrefix: es.aep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AEPTarimaCore:
    path: AEPTarimaCore
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: "2.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

targets:
  AEPTarima:
    type: application
    platform: iOS
    sources:
      - path: AEPTarima
    configFiles:
      Debug: AEPTarima/Config/Config.xcconfig
      Release: AEPTarima/Config/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.aep.tarima
        INFOPLIST_FILE: AEPTarima/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AEPTarimaCore
        product: AEPTarimaCore
      - package: Supabase
        product: Supabase
      - package: GRDB
        product: GRDB
