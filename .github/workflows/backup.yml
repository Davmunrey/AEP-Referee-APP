name: Backup

# Copia de seguridad lógica (export JSON) de las tablas críticas de Supabase.
# - Se ejecuta a diario y bajo demanda (workflow_dispatch).
# - Siempre `create` + `verify`: prueba de forma continua que el backup funciona.
# - El backup contiene datos personales de jueces, así que NO se sube en claro:
#   se cifra con GPG (AES256) y solo se sube como artefacto si está configurado
#   el secret `BACKUP_PASSPHRASE`. Sin ese secret el job sigue siendo un
#   health-check válido (crea y verifica, pero no retiene nada).
#
# Restaurar un artefacto:
#   gpg --batch --decrypt --passphrase "<BACKUP_PASSPHRASE>" \
#     aep-backup-XXXX.json.gpg > aep-backup-XXXX.json
#   node scripts/backup-supabase.mjs verify aep-backup-XXXX.json

on:
  schedule:
    # A diario a las 03:17 UTC (minuto no redondo para no saturar el scheduler).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase backup
    runs-on: ubuntu-latest
    # Disponible en todos los steps (incluido el `if` de gating). Las cadenas
    # vacías indican "secret no configurado"; los secrets se enmascaran en logs.
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # Sin frase de paso los pasos de cifrar y subir se saltaban y el job
      # terminaba en verde: una copia nocturna que no guardaba nada y no
      # avisaba a nadie. Ahora falla antes de empezar.
      - name: Comprobar que hay frase de cifrado
        run: |
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error title=Falta BACKUP_PASSPHRASE::Sin ella la copia no se cifra ni se sube. Créala en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Create backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-supabase.mjs create

      - name: Verify backup integrity
        run: node scripts/backup-supabase.mjs verify

      # Volcado completo: esquema, datos y cuentas (auth.users con el resumen
      # de las contraseñas), que la copia JSON por la API no puede traer. Es el
      # que se restaura con pg_restore (ver docs/DEPLOY.md). El cliente 17
      # vuelca servidores de su versión y anteriores.
      - name: Volcado completo con pg_dump
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PGURL}" ]; then
            echo "::error title=Falta SUPABASE_DB_URL::Es la misma cadena del Session pooler que usa el workflow de migraciones."
            exit 1
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump "$PGURL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file "backups/aep-pgdump-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"
          ls -l backups/*.dump

      - name: Encrypt backup (AES256)
        run: |
          shopt -s nullglob
          for f in backups/*.json backups/*.dump; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "$f"
            rm -f "$f"
          done

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v6
        with:
          name: aep-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 90
          if-no-files-found: error
