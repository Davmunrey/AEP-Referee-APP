name: iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

# Cancela ejecuciones anteriores de la misma rama/PR.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versión de Swift / Xcode
        run: swift --version && xcodebuild -version

      - name: Test del núcleo (AEPTarimaCore)
        working-directory: apps/ios/AEPTarimaCore
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        working-directory: apps/ios
        run: xcodegen generate

      - name: Compilar la app (simulador, sin firma)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project AEPTarima.xcodeproj \
            -scheme AEPTarima \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
