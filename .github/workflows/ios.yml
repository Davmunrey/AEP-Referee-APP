name: iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

# Cancela ejecuciones anteriores de la misma rama/PR.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versión de Swift / Xcode
        run: swift --version && xcodebuild -version

      - name: Test del núcleo (AEPTarimaCore)
        working-directory: apps/ios/AEPTarimaCore
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        working-directory: apps/ios
        run: xcodegen generate

      - name: Compilar la app (simulador, sin firma)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project AEPTarima.xcodeproj \
            -scheme AEPTarima \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # Captura del escaparate (best-effort): nunca tumba ni cuelga el gate.
      # timeout-minutes garantiza que no se quede colgado el runner.
      - name: Captura del escaparate (UI)
        working-directory: apps/ios
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -x
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" || true   # espera a que el simulador esté listo
          APP=$(find build/Build/Products -name 'AEPTarima.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          # Escaparate de componentes (sin red, sin sesión).
          xcrun simctl launch "$UDID" es.aep.tarima -uiPreview || true
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/gallery.png || true

      - name: Subir capturas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: apps/ios/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
