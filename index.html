<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEP Tarima — Sistema de Gestión de Jueces</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Geist', 'system-ui', 'sans-serif'],
        mono: ['Geist Mono', 'ui-monospace', 'monospace'],
      },
      colors: {
        bg: {
          base: '#0B0A09',
          surface: '#141210',
          raised: '#1B1916',
          hover:  '#221F1B',
          inset:  '#0F0D0B',
        },
        line: {
          DEFAULT: '#2A2522',
          strong:  '#3A332E',
          subtle:  '#1F1C19',
        },
        ink: {
          high:    '#F5F0E8',
          mid:     '#B8B0A4',
          low:     '#7A7269',
          faint:   '#4A443E',
        },
        aep: {
          red:     '#D43426',
          'red-dim': '#8E1F16',
          amber:   '#E8A82C',
          'amber-dim': '#8A6516',
        },
        ok: {
          DEFAULT: '#3F9F6A',
          dim:     '#1F4F36',
        },
        warn: {
          DEFAULT: '#E8A82C',
          dim:     '#5A4314',
        },
        bad: {
          DEFAULT: '#D43426',
          dim:     '#5A1A14',
        },
      },
      boxShadow: {
        'card': '0 1px 0 0 rgba(255,255,255,0.02) inset, 0 0 0 1px rgba(255,255,255,0.01)',
        'pop':  '0 12px 32px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04)',
      },
    },
  },
};
</script>
<style>
  html, body {
    background: #0B0A09;
    color: #F5F0E8;
    font-family: 'Geist', system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2A2522; border-radius: 4px; border: 2px solid #0B0A09; }
  ::-webkit-scrollbar-thumb:hover { background: #3A332E; }

  /* Mono numerics */
  .tabular { font-variant-numeric: tabular-nums; }

  /* Subtle grain */
  .grain::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 0;
  }

  /* Drag visuals */
  .ref-card.dragging { opacity: 0.4; }
  .slot.drop-target { background: rgba(212, 52, 38, 0.08); border-color: #D43426 !important; }

  /* Calendar bar fill */
  .fill-bar {
    background: linear-gradient(90deg, transparent 0%, currentColor 100%);
  }

  /* Focus ring */
  button:focus-visible, [role="button"]:focus-visible, input:focus-visible {
    outline: 2px solid #E8A82C;
    outline-offset: 2px;
  }

  /* Disable selection where not desired */
  .no-sel { user-select: none; }
</style>
</head>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/Dashboard.jsx"></script>
  <script type="text/babel" src="src/RosterBuilder.jsx"></script>
  <script type="text/babel" src="src/Directorio.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
